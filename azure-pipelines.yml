trigger:
- *

pool:
  vmImage: 'ubuntu-latest'

variables:
  wwwrootDir: 'Tailspin.SpaceGame.Web/wwwroot'
  buildConfiguration: 'Release'
  releaseBranchName: 'release'

steps:
- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '8.x'   # Update to '8.x' if your codebase supports .NET 8

- script: 'npm ci'
  displayName: 'Install npm dependencies (clean install)'

- script: 'npx sass $(wwwrootDir):$(wwwrootDir)'
  displayName: 'Compile SCSS with Dart Sass'
  # Make sure your package.json uses "sass" instead of "node-sass"

- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet packages'
  inputs:
    command: 'restore'
    projects: '**/*.csproj'

- task: DotNetCoreCLI@2
  displayName: 'Build solution'
  inputs:
    command: 'build'
    projects: '**/*.csproj'
    arguments: '--configuration $(buildConfiguration)'

- task: DotNetCoreCLI@2
  displayName: 'Run tests'
  inputs:
    command: 'test'
    projects: '**/*Tests/*.csproj'
    arguments: '--configuration $(buildConfiguration)'

- task: DotNetCoreCLI@2
  displayName: 'Publish Web Project'
  inputs:
    command: 'publish'
    publishWebProjects: true
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
    zipAfterPublish: true

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'

- task: AzureWebApp@1
  displayName: 'Deploy to Azure Web App'
  inputs:
    azureSubscription: 'evfdev'
    appName: '$(WebAppNameDev)'
    package: '$(Build.ArtifactStagingDirectory)/**/*.zip'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/release'))
